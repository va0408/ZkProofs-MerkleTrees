name: Merkle CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  suma_modular:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: sudo apt update && sudo apt install -y rustc cargo
    - run: |
        git clone --branch v2.0.5 https://github.com/iden3/circom.git
        cd circom && cargo build --release && cargo install --path circom
    - run: npm install -g snarkjs
    - name: Compile suma_modular
      run: |
        mkdir -p suma_modular_js
        circom suma_modular.circom --r1cs --wasm --sym -o suma_modular_js
    - name: Setup powers of tau
      run: |
        mkdir -p zkptau
        cp powersOfTau28_hez_final_10.ptau zkptau/
        wget https://github.com/va0408/ZkProofs-MerkleTrees/releases/download/v1.0/powersOfTau28_hez_final_15.ptau -O zkptau/powersOfTau28_hez_final_15.ptau
    - name: Export verification key
      run: snarkjs zkey export verificationkey suma_modular_0001.zkey suma_verification_key.json
    - run: |
        node suma_modular_js/suma_modular_js/generate_witness.js suma_modular_js/suma_modular_js/suma_modular.wasm input.json witness.wtns
        snarkjs groth16 prove suma_modular_0001.zkey witness.wtns proof.json public.json
        snarkjs groth16 verify suma_verification_key.json public.json proof.json

  merkle:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: sudo apt update && sudo apt install -y rustc cargo
    - run: |
        git clone --branch v2.0.5 https://github.com/iden3/circom.git
        cd circom && cargo build --release && cargo install --path circom
    - run: npm install -g snarkjs
    - name: Compile merkle (7 hojas)
      run: |
        mkdir -p merkle_js
        circom merkle.circom --r1cs --wasm --sym -o merkle_js
    - name: Fix witness path for merkle
      run: |
        cp merkle_js/merkle_js/generate_witness.js merkle_js/
        cp merkle_js/merkle_js/merkle.wasm merkle_js/
    - name: Setup powers of tau
      run: |
        mkdir -p zkptau
        cp powersOfTau28_hez_final_10.ptau zkptau/
        wget https://github.com/va0408/ZkProofs-MerkleTrees/releases/download/v1.0/powersOfTau28_hez_final_15.ptau -O zkptau/powersOfTau28_hez_final_15.ptau
    - name: Export verification key
      run: snarkjs zkey export verificationkey merkle_0001.zkey merkle_verification_key.json
    - run: node run_casesMerkle.js

  merkleN:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: sudo apt update && sudo apt install -y rustc cargo
    - run: |
        git clone --branch v2.0.5 https://github.com/iden3/circom.git
        cd circom && cargo build --release && cargo install --path circom
    - run: npm install -g snarkjs
    - name: Compile merkleN (10 hojas)
      run: |
        mkdir -p merkleN_js
        circom merkleN.circom --r1cs --wasm --sym -o merkleN_js
    - name: Fix witness path for merkleN
      run: |
        cp merkleN_js/merkleN_js/generate_witness.js merkleN_js/
        cp merkleN_js/merkleN_js/merkleN.wasm merkleN_js/
    - name: Setup powers of tau
      run: |
        mkdir -p zkptau
        cp powersOfTau28_hez_final_10.ptau zkptau/
        wget https://github.com/va0408/ZkProofs-MerkleTrees/releases/download/v1.0/powersOfTau28_hez_final_15.ptau -O zkptau/powersOfTau28_hez_final_15.ptau
    - name: Export verification key
      run: snarkjs zkey export verificationkey merkleN_0001.zkey merkleN_verification_key.json
    - run: node run_casesMerkleN.js


