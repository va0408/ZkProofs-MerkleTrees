name: Merkle CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-circom:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Rust
      run: |
        sudo apt update
        sudo apt install -y rustc cargo

    - name: Build circom v2.0.5 from source
      run: |
        git clone --branch v2.0.5 https://github.com/iden3/circom.git
        cd circom
        cargo build --release
        cargo install --path circom
        circom --version

    - name: Install snarkjs
      run: |
        npm install -g snarkjs

    - name: Compile circuits
      run: |
        circom suma_modular.circom --r1cs --wasm --sym -o suma_js
        circom merkle.circom --r1cs --wasm --sym -o merkle_js
        circom merkleN.circom --r1cs --wasm --sym -o merkleN_js

    - name: List compiled files
      run: |
        ls -R suma_js
        ls -R merkle_js
        ls -R merkleN_js

    - name: Setup powers of tau
      run: |
        mkdir -p zkptau
        # Copiamos el de 10 que está en la raíz del repo
        cp powersOfTau28_hez_final_10.ptau zkptau/
        # Descargamos el de 15 desde el release
        wget https://github.com/va0408/ZkProofs-MerkleTrees/releases/download/v1.0/powersOfTau28_hez_final_15.ptau -O zkptau/powersOfTau28_hez_final_15.ptau

    - name: Setup zkeys for suma modular
      run: |
        snarkjs groth16 setup suma_js/suma_modular.r1cs zkptau/powersOfTau28_hez_final_10.ptau suma_0000.zkey
        snarkjs zkey contribute suma_0000.zkey suma_0001.zkey --name="First contribution"
        snarkjs zkey export verificationkey suma_0001.zkey suma_verification_key.json

    - name: Setup zkeys for merkle
      run: |
        snarkjs groth16 setup merkle_js/merkle.r1cs zkptau/powersOfTau28_hez_final_15.ptau merkle_0000.zkey
        snarkjs zkey contribute merkle_0000.zkey merkle_0001.zkey --name="First contribution"
        snarkjs zkey export verificationkey merkle_0001.zkey verification_key.json

    - name: Setup zkeys for merkleN
      run: |
        snarkjs groth16 setup merkleN_js/merkleN.r1cs zkptau/powersOfTau28_hez_final_15.ptau merkleN_0000.zkey
        snarkjs zkey contribute merkleN_0000.zkey merkleN_0001.zkey --name="First contribution"
        snarkjs zkey export verificationkey merkleN_0001.zkey verification_key.json

    - name: Run modular tests
      run: |
        node run_cases.js

    - name: Run merkle tests (4 hojas)
      run: |
        node run_casesMerkle.js

    - name: Run merkle tests (10 hojas)
      run: |
        node run_casesMerkleN.js
